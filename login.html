<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in | AgriRenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth">
    <!-- Same hero video as the home page -->
    <video class="auth-video" autoplay muted loop playsinline preload="auto"
           poster="images/harves.png" src="harvestervid.mp4"></video>
    <div class="auth-shade"></div>
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>

    <section class="glass auth-card">
      <a href="index.html" class="auth-logo" aria-label="AgriRenta home">
        <img src="logo.png" alt="AgriRenta logo" />
      </a>
      <h1 style="font-size:2.6rem;margin-top:1rem">Log in</h1>
      <p>Log in to book equipment or manage your listings.</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />

        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
        </div>

        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <p class="auth-note" id="msg">No account yet? Registration comes in the next step.</p>
      <p class="auth-note"><a href="index.html">Back to home</a></p>
    </section>
  </main>

  <script>
    // If they came from an equipment page, remind them what they were booking
    const wanted = new URLSearchParams(location.search).get("book");
    if (wanted) {
      document.querySelector(".auth-card > p").textContent = "Log in to book: " + wanted + ".";
    }

    // Show / hide password
    const pw = document.getElementById("password");
    const pwToggle = document.getElementById("pwToggle");
    pwToggle.addEventListener("click", () => {
      const show = pw.type === "password";
      pw.type = show ? "text" : "password";
      pwToggle.textContent = show ? "Hide" : "Show";
      pwToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    // Placeholder only. In the next step this will call the backend (database).
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("msg").textContent = "Login is not connected to the database yet.";
    });
  </script>
</body>
</html>
